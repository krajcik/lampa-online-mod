name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node build.mjs
      - run: node --check online_mod.js
      - run: node --check bwa-clean.js
      - run: node --test tests/*.test.mjs
